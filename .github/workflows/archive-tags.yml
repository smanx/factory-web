name: Archive Tags to history

# 仅手动触发，无需任何输入
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-tags
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史与全部 tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 收集所有版本号 tag
        id: tags
        run: |
          set -e
          # 版本号形式的 tag：1.2.3 / v1.2.3 / 1.0.0-beta 等
          git tag -l | grep -E '^v?[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$' > work_tags.txt || true
          sort -u -o work_tags.txt work_tags.txt
          echo "count=$(wc -l < work_tags.txt)" >> "$GITHUB_OUTPUT"
          echo "匹配到 $(wc -l < work_tags.txt) 个 tag"

      - name: 并行切换每个 tag 并打包
        # 对每个 tag：拉取本项目 -> 切到该 tag -> 打包（去掉 .git 外壳）-> 改名为该 tag 的目录
        # 各 tag 在独立临时目录中完成，互不冲突，因此可用 -P 并行
        run: |
          set -e
          mkdir -p export
          if [ -s work_tags.txt ]; then
            cat work_tags.txt | xargs -P "$(nproc)" -I{} bash -c '
              set -e
              name="{}"
              staging="$RUNNER_TEMP/build-${name//[^A-Za-z0-9_.-]/_}"
              git clone --quiet --no-checkout --branch "$name" "$GITHUB_WORKSPACE" "$staging"
              git -C "$staging" checkout --quiet "$name"
              mv "$staging" "export/$name"        # 改名：目录以 tag 命名
              rm -rf "export/$name/.git"          # 打包仅保留源码文件
            '
          else
            echo "没有匹配到可归档的版本号 tag"
          fi

      - name: 强制推送所有 tag 目录到 history 分支（覆盖重建）
        if: steps.tags.outputs.count != '0'
        run: |
          cd export
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b history
          git add -A
          git commit -m "history: $(date -u +'%Y-%m-%dT%H:%M:%SZ') archive of $(wc -l < ../work_tags.txt) tags"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin history