name: opencode

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |-
      (github.event_name == 'issues' && contains(github.event.issue.body, '/oc')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/oc')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.MODEL || 'opencode/x-preview-f-free' }}
          use_github_token: true
          prompt: |
            你收到了一个开发任务。请先阅读下方提供的上下文信息，自行判断任务类型并处理：
            - 功能需求：按描述设计并直接实现；
            - bug 报告：定位根因并修复；
            - 其他（重构、优化、答疑、文档等）：按你认为最合理的方式完成。
            - 这是一个复刻《异星工厂》的游戏，如果没有明确说明，或者你不清楚该怎么做，就完全按照异星工厂的设计逻辑来处理。
            如果上下文信息不足以确定意图，选择对当前仓库最有帮助的做法。完成后在回复中总结你做了什么、为什么这样做。