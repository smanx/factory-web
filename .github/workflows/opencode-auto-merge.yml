name: opencode auto merge

on:
  workflow_run:
    workflows: [opencode]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge opencode pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          lines=$(gh pr list --repo "$REPO" --state open \
            --author "github-actions[bot]" \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("opencode/")) | "\(.number) \(.headRefName)"')
          [ -z "$lines" ] && { echo "no open opencode PRs"; exit 0; }
          while read -r number branch; do
            echo "::group::PR #$number ($branch)"
            if gh pr merge "$number" --repo "$REPO" --merge; then
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"; then
                echo "merged #$number and deleted branch $branch"
              else
                echo "::warning::merged #$number but failed to delete branch $branch"
              fi
            else
              echo "::warning::merge #$number failed, branch kept"
            fi
            echo "::endgroup::"
          done <<< "$lines"
