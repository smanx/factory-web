name: data-verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖（fengari 等，convert-data 解析官方 Lua 数据所需）
        run: npm ci --no-audit --no-fund

      - name: 全量回归校验（配方/堆叠/吞吐/数据完整性）
        run: |
          set -e
          echo "==== 语法校验 ===="
          for f in $(find js tools -name '*.js'); do node --check "$f"; done
          echo "---- 数据/物理参数回归 ----"
          node tools/run-verify.js
