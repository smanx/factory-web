<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工厂原型 Factory Proto</title>
<link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud-info"></div>
<div id="topright" class="collapsed">
  <button id="btn-menu-toggle" title="折叠/展开顶部菜单">☰</button>
  <div id="topright-menu">
  <button id="btn-inv">背包 (E)</button>
  <button id="btn-tech">研究 (T)</button>
  <button id="btn-stats">统计 (P)</button>
  <button id="btn-blue">蓝图 (B)</button>
  <button id="btn-red">红图 (Alt+D)</button>
  <button id="btn-green">绿图 (Alt+U)</button>
  <button id="btn-set">设置 (O)</button>
  </div>
</div>
<div id="hotbar"></div>
<div id="deconstruct-btn" class="hidden" title="拆除模式（点触建筑拆除，替代手机右键）">✖ 拆除</div>
<div id="panel">
  <div id="panel-head">
    <span id="panel-title"></span>
    <button id="panel-close">✕</button>
  </div>
  <div id="panel-body"></div>
</div>
<div id="toasts"></div>
<div id="greenbar" style="display:none"></div>
<div id="tooltip"><b></b><span></span></div>
<div id="joystick" class="joystick hidden"><div id="joystick-knob"></div></div>
<div id="dbg-btn">DBG</div>
<div id="dbg-panel"></div>

<!-- 开始菜单：新游戏 / 读取存档 -->
<div id="start-screen">
  <div class="start-bg"></div>
  <div class="start-box">
    <div class="start-logo">
      <div class="start-title">工厂原型</div>
      <div class="start-sub">FACTORY PROTO</div>
    </div>
    <div class="start-menu">
      <button id="btn-new-game" class="start-btn primary">▶ 开始新游戏</button>
      <button id="btn-continue" class="start-btn">📂 读取存档</button>
      <div id="start-save-info" class="start-save-info"></div>
    </div>

    <!-- 读取存档：弹出存档列表弹层，可选指定存档或一键加载最新 -->
    <div id="load-save-overlay" class="load-save-overlay hidden">
      <div class="load-save-panel">
        <div class="load-save-head">
          <span class="load-save-title">📂 读取存档</span>
          <button id="load-save-close" class="load-save-close" title="关闭">✕</button>
        </div>
        <button id="btn-load-newest" class="load-newest-btn">⚡ 一键加载最新存档</button>
        <div id="load-save-list" class="load-save-list"></div>
      </div>
    </div>
    <div class="start-hint">
      WASD 移动 · 左键建造/挖矿 · 右键拆除 · R 旋转 · F 拿取 ·
      中键/E 面板 · T 科技 · K/L 存读档
    </div>
    <div class="start-hint sub">📱 手机/触屏：点按建造/开面板/移动 · 长按建筑弹操作盘（旋转/拆除/复制） · 拖动平移视角 · 双指捏合缩放 · 双击旋转/回中</div>
  </div>
</div>
